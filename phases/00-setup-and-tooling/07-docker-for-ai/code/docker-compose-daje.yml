services:

  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../../../../:/workspace
      - ../../../../.models:/models
      - ../../../../.datasets:/data

    ports:
      - "8894:8894"

    stdin_open: true

    tty: true

    command: jupyter lab --ip=0.0.0.0 --port=8894 --allow-root
