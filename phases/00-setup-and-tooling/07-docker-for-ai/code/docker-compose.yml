services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../../../:/workspace
      - ~/.models:/models
      - ~/.datasets:/data
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
